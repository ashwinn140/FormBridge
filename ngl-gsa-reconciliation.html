<style>

  --font:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){

    --paper:#10171d; --surface:#18222b; --ink:#e7edf2; --muted:#9aa9b6; --line:#2d3b47; --line-soft:#232f39;
    --accent:#4fb4d6; --accent-ink:#06222d; --accent-soft:#17323f;
    --err:#ff9b92; --err-bg:#3b1f1d; --warn:#f2bd6b; --warn-bg:#392a12; --info:#8db9f2; --info-bg:#1b2d45; --ok:#7fd0a1; --ok-bg:#17301f;
  }
}
:root[data-theme="dark"]{
  --paper:#10171d; --surface:#18222b; --ink:#e7edf2; --muted:#9aa9b6; --line:#2d3b47; --line-soft:#232f39;
  --accent:#4fb4d6; --accent-ink:#06222d; --accent-soft:#17323f;
  --err:#ff9b92; --err-bg:#3b1f1d; --warn:#f2bd6b; --warn-bg:#392a12; --info:#8db9f2; --info-bg:#1b2d45; --ok:#7fd0a1; --ok-bg:#17301f;
}
*{box-sizing:border-box}

body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

h1{margin:0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.01em}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.card h2{margin:0 0 4px;font-size:18px}

.st.Error{background:var(--err-bg);color:var(--err)} .st.Warning{background:var(--warn-bg);color:var(--warn)} .st.Clear{background:var(--ok-bg);color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}

tr.Error td:first-child{box-shadow:inset 4px 0 0 var(--err)} tr.Warning td:first-child{box-shadow:inset 4px 0 0 var(--warn)} tr.Clear td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
.tablewrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar .field{min-width:150px}

.kpi.e b{color:var(--err)} .kpi.w b{color:var(--warn)} .kpi.c b{color:var(--ok)}
h3{margin:26px 0 10px;font-size:17px}
.rg{margin:0 0 26px}
.rg h3{margin-top:0}
.rule{display:grid;grid-template-columns:34px 1fr;gap:6px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:10px}
.rule.off{opacity:.6}
.rule .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.cols{margin-bottom:14px}
@media (max-width:640px){.wrap{padding:14px 12px 48px}h1{font-size:23px}.rule{grid-template-columns:1fr}.rule dl{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.st.s-ok{background:var(--ok-bg);color:var(--ok)} .st.s-review{background:var(--warn-bg);color:var(--warn)} .st.s-exception{background:var(--err-bg);color:var(--err)} .st.s-othco{background:var(--info-bg);color:var(--info)} .st.s-missing{background:var(--err-bg);color:var(--err)} .st.s-void{background:var(--paper);color:var(--muted)}
.slot{border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;margin-top:12px}
.slot .drop{margin-top:10px;padding:12px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)} .tag.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.note{margin:8px 0 0;font-size:13px;color:var(--muted)} .note.err{color:var(--err)}
.muted{color:var(--muted);font-size:12px} ul.plain{margin:0 0 6px;padding-left:18px} ul.plain li{margin:2px 0}
tr.Clear td:first-child{box-shadow:inset 4px 0 0 var(--ok)}

<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>NGL GSA Reconciliation tool</h1>
      <p class="sub">Checks GSA invoice lines against the Air Export Shipment Register, the pricing sheet and the job profit report, with the same code as the NGL IATA Reconciliation tool. Every flag carries a code, so nothing is left to interpretation.</p>
    </div>
    <span class="ver" id="ver"></span>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <section id="v-files"></section>
  <section id="v-rules" hidden></section>
  <section id="v-results" hidden></section>
  <section id="v-invoices" hidden></section>
  <section id="v-summary" hidden></section>
  <section id="v-unbilled" hidden></section>
</div>
<script>

/* CASS reconciliation core — pure logic, no DOM. Works in browser and node. */
(function (root) {
'use strict';

/* ---------- small helpers ---------- */
const MON = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const pad = n => String(n).padStart(2, '0');
const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;

function toNum(v) {
  if (v == null) return NaN;
  if (typeof v === 'number') return v;
  let s = String(v).trim(), neg = false;
  if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
  s = s.replace(/,/g, '');
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  const x = parseFloat(s);
  return neg ? -x : x;
}

function parseDateLoose(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return iso(v.getFullYear(), v.getMonth() + 1, v.getDate());
  const s = String(v).trim();
  let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return iso(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[A-Za-z]*[-\/ ](\d{2,4})/))) {
    let y = +m[3]; if (y < 100) y += 2000;
    const mo = MON[m[2].toUpperCase()];
    if (mo) return iso(y, mo, +m[1]);
  }
  if ((m = s.match(/^([A-Za-z]{3})[A-Za-z]*\.? (\d{1,2}),? (\d{4})/))) { const mo = MON[m[1].toUpperCase()]; if (mo) return iso(+m[3], mo, +m[2]); }
  if (/^\d{5}$/.test(s) && +s > 30000 && +s < 70000) { const d = new Date(Math.round((+s - 25569) * 86400000)); return iso(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) {
    let y = +m[3]; if (y < 100) y += 2000;
    return iso(y, +m[2], +m[1]);
  }
  return null;
}
const dayDiff = (a, b) => {
  const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
  return Math.round((Date.UTC(pa[0], pa[1] - 1, pa[2]) - Date.UTC(pb[0], pb[1] - 1, pb[2])) / 86400000);
};
const addDays = (a, n) => {
  const p = a.split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
  return iso(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
};
const execToIso = s => /^\d{6}$/.test(s) ? iso(2000 + +s.slice(0, 2), +s.slice(2, 4), +s.slice(4, 6))
                     : /^\d{8}$/.test(s) ? iso(+s.slice(0, 4), +s.slice(4, 6), +s.slice(6, 8)) : null;

/* ---------- CASS PDF parsing ----------
   Input: pages = array of arrays of text strings, in PDF content-stream order
   (what pdf.js getTextContent() returns). */
const RE = {
  org6: /^[A-Z]{6}$/, serial: /^\d{8}$/, sp: /^[A-Z]{2}$/, wt: /^\d+\.\d-?$/,
  amt: /^\d[\d,]*\.\d{1,2}-?$/, exec6: /^\d{6}$/, alCode: /^\d{3}[A-Z]?$/,
  invNo: /^IN\d{3}[A-Z]?-\d{2}-\d+$/, dateTok: /^\d{2}-[A-Za-z]{3}-\d{2}$/, chg: /^[A-Z]{2}\.[A-Z]$/
};
const GSTIN_RE = /\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]/g;

function classify(toks) {
  const t = toks.join(' ').toUpperCase();
  if (t.includes('CONSOLIDATED TAX INVOICE/REPORT')) return 'consol';
  if (t.includes('OTHER CHARGES SPECIFICATION')) return 'othchg';
  if (t.includes('SERVICE RECIPIENT (SR) TAX REPORT')) return 'taxrep';
  if (t.includes('EXPORT BILLING STATEMENT')) return 'stmt';
  if (t.includes('TAX INVOICE') && t.includes('ORIGINAL FOR')) return 'taxinv';
  const set = new Set(toks.map(x => x.toUpperCase()));
  if (set.has('PAYMENT') && set.has('SUMMARY')) return 'paysum';
  return 'other';
}
function findAirlineCode(toks) {
  for (let i = 0; i < toks.length - 2; i++)
    if (toks[i] === 'AIRLINE' && toks[i + 1] === ':' && RE.alCode.test(toks[i + 2])) return toks[i + 2];
  return null;
}
function findPeriod(toks) {
  for (let i = 0; i < toks.length - 1; i++) {
    if (toks[i] === 'BILLING' && toks[i + 1] === 'PERIOD') {
      const d = [];
      for (let j = i + 2; j < Math.min(toks.length, i + 12) && d.length < 2; j++) if (RE.dateTok.test(toks[j])) d.push(parseDateLoose(toks[j]));
      if (d.length === 2) return d;
    }
  }
  return null;
}
const isRowStart = (t, j) => RE.org6.test(t[j] || '') && RE.serial.test(t[j + 1] || '') && RE.sp.test(t[j + 2] || '');

function parseConsolRows(toks) {
  const rows = [];
  for (let i = 0; i < toks.length - 4; i++) {
    if (isRowStart(toks, i) && RE.wt.test(toks[i + 3])) {
      const rest = []; let j = i + 4;
      while (j < toks.length && !(isRowStart(toks, j) && RE.wt.test(toks[j + 3] || '')) && toks[j] !== 'TOTAL') { rest.push(toks[j]); j++; }
      const amts = rest.filter(x => RE.amt.test(x)).map(toNum);
      const exec = rest.find(x => RE.exec6.test(x));
      if (amts.length >= 9 && exec) {
        // order: netBefore, netPayable, taxCol, certNo(0.00), | exec | otherChgs, commission, collA, collB, weightCharge
        const [netBefore, netPayable, taxCol, , oc, comm, cA, cB, wc] = amts;
        rows.push({ serial: toks[i + 1], sp: toks[i + 2], orgdes: toks[i], weight: toNum(toks[i + 3]),
          netBefore, netPayable, taxCol, execDate: execToIso(exec), otherCharges: oc, commission: comm,
          collectA: cA, collectB: cB, wtCharge: wc });
      }
      i = j - 1;
    }
  }
  return rows;
}
function parseTaxInvRows(toks) {
  const m = {};
  for (let i = 0; i < toks.length - 4; i++) {
    if (isRowStart(toks, i) && RE.amt.test(toks[i + 3] || '')) {
      const a = []; let j = i + 3;
      while (j < toks.length && RE.amt.test(toks[j]) && a.length < 6) { a.push(toks[j]); j++; }
      if (a.length === 6) {
        const [taxable, total, cgst, utgst, sgst, igst] = a.map(toNum);
        m[toks[i + 1] + '|' + toks[i + 2]] = { taxable, total, cgst, utgst, sgst, igst, gst: r2(cgst + utgst + sgst + igst) };
      }
    }
  }
  return m;
}
function parseTaxRepRows(toks) {
  const m = {};
  for (let i = 0; i < toks.length - 8; i++) {
    if (RE.alCode.test(toks[i]) && RE.serial.test(toks[i + 1]) && RE.sp.test(toks[i + 2]) && RE.org6.test(toks[i + 3]) && RE.wt.test(toks[i + 4])) {
      const a = []; let j = i + 5; let exec = null;
      while (j < toks.length && j < i + 12) {
        if (RE.amt.test(toks[j])) a.push(toNum(toks[j]));
        else if (/^\d{8}$/.test(toks[j])) exec = toks[j];
        else break;
        j++;
      }
      // tdsFreight, tdsComm, netTax, [exec], gst
      if (a.length >= 4) m[toks[i + 1] + '|' + toks[i + 2]] = { airlineCode: toks[i], tdsFreight: a[0], tdsComm: a[1], netTax: a[2], gst: a[3], exec: exec && execToIso(exec) };
    }
  }
  return m;
}
function parseOtherCharges(toks) {
  const m = {};
  for (let i = 0; i < toks.length - 2; i++) {
    if (RE.serial.test(toks[i]) && RE.chg.test(toks[i + 1] || '')) {
      const ch = {}; let j = i + 1;
      while (j < toks.length - 1 && RE.chg.test(toks[j]) && RE.amt.test(toks[j + 1])) { ch[toks[j]] = toNum(toks[j + 1]); j += 2; }
      m[toks[i]] = ch; i = j - 1;
    }
  }
  return m;
}
function parseStatementRows(toks) {
  const out = [];
  for (let i = 0; i < toks.length - 10; i++) {
    if (RE.alCode.test(toks[i]) && /^[A-Z0-9]{2}$/.test(toks[i + 1]) && RE.amt.test(toks[i + 2])) {
      const a = []; let j = i + 2;
      while (j < toks.length && RE.amt.test(toks[j]) && a.length < 8) { a.push(toNum(toks[j])); j++; }
      if (a.length === 8) out.push({ airlineCode: toks[i], iata2: toks[i + 1], wtCharge: a[0], otherCharges: a[1], commission: a[5], tax: a[6], payable: a[7], invoiceNo: RE.invNo.test(toks[j] || '') ? toks[j] : null });
    }
  }
  return out;
}

function parseCass(pages) {
  const warnings = [];
  const joinedAll = pages.map(p => p.join('')).join('');
  const agentM = joinedAll.toUpperCase().match(/IATA\s*NUMERIC\s*CODE\s*:?/); // presence only
  let agentGstin = null, iata = null, periodFrom = null, periodTo = null, remitDate = null, netDue = null;
  const invoices = {}; const taxInv = {}; const taxRep = {}; const oth = {}; let statement = [];
  const ensure = code => invoices[code] || (invoices[code] = { airlineCode: code, prefix: code.slice(0, 3), invoiceNo: null, invoiceDate: null, vendorGstin: null, rows: [] });

  for (const toks of pages) {
    const kind = classify(toks);

      const sum = k => r2(g.filter(r => r.sp === 'DL' || r.sp === 'AD').reduce((s, r) => s + (isFinite(r[k]) ? r[k] : 0), 0));

      if (Math.abs(calc - row.netBefore) > 1) iss.push({ sev: 'warn', code: 'cass_net', msg: `CASS line: weight charge + other − commission = ${r2(calc).toFixed(2)}, but net before tax is ${row.netBefore.toFixed(2)}` });

  });
  const invList = Object.values(invoices).sort((a, b) => a.airlineCode.localeCompare(b.airlineCode));
  invList.forEach(i => { i.periodFrom = periodFrom; i.periodTo = periodTo; i.remitDate = remitDate; });
  if (!flat.length) warnings.push('No AWB lines found. Check that this is the CASS India “Cargo Sales Report” PDF.');
  const notes = [];
  const adj = invList.some(i => i.adjustment) || pages.some(p => p.some(x => /\(ADJUSTMENT\)/i.test(x)));
  const detailed = new Set(invList.map(i => i.airlineCode));
  const noDetail = statement.filter(st => !detailed.has(st.airlineCode));
  if (noDetail.length && flat.length) {
    const amt = r2(noDetail.reduce((s, x) => s + x.payable, 0));
    notes.push({ sev: 'warn', missingInv: noDetail.map(x => x.invoiceNo).filter(Boolean), text: `The statement in this PDF also lists ${noDetail.map(x => x.iata2 + ' ' + x.airlineCode).join(', ')} (₹${amt.toFixed(2)} payable) but gives no AWB lines for them, so only ${invList.length} airline invoice${invList.length > 1 ? 's' : ''} can be reconciled from this file.` });

function parseRate(v) {

/* Title rows of some register exports use rich-text shared strings that SheetJS can't read,

function scopeFromSST(xml) {
  const out = { company: '', from: null, to: null, branch: null };
  if (!xml) return out;
  const sis = xml.split(/<(?:\w+:)?si[ >]/).slice(1);
  const texts = sis.map(si => (si.match(/<(?:\w+:)?t[^>]*>[^<]*<\/(?:\w+:)?t>/g) || []).map(t => t.replace(/<[^>]+>/g, '')).join(''));

function detectHeaderRow(aoa) {

    FIELD_EXACT.forEach(f => { if (cells.some(c => f.set.has(c))) { sc++; if (f.key === 'awb') hasAwb = true; } });
    const total = hasAwb ? sc + 100 : sc;
    if (total > bestScore) { bestScore = total; best = i; }
  }
  return bestScore >= 2 ? best : -1;
}

    if (idx < 0 && f.fuzzy) idx = cells.findIndex((c, i) => !used.has(i) && c && f.fuzzy(c));

    const lead = Object.entries(origCount).sort((a, b) => b[1] - a[1]).map(([c, n]) => `${c} ×${n}`).join(', ');
    scopeMsgs.push({ sev: missingOrigins.length === Object.keys(origCount).length ? 'err' : 'warn',
      text: `CASS origins: ${lead}. ${missingOrigins.join(', ')} not present among the register loading ports — wrong branch or company?` });
  }

  /* per CASS line */
  const out = cass.rows.map(row => {
    if (row.sp === 'VD' || (row.weight === 0 && !row.netBefore && !row.netPayable)) {
      const vr = byKey.get(row.awb11) || [];
      return { cass: row, reg: vr, status: 'void', found: {}, issues: [{ sev: 'info', code: 'void', msg: 'Void AWB (SP VD): nothing was billed on CASS' }], rates: null, regWeight: null, company: vr[0] ? vr[0].company : null, quote: null, quoteWhy: null, actual: null };
    }
    const issues = row.cassIssues.filter(i => i.code !== 'cass_net' || o.flags.cassCalc);
    const all = byKey.get(row.awb11) || [];
    const found = {}; all.forEach(r => { (found[r.company] = found[r.company] || []); if (r.shipmentNo && !found[r.company].includes(r.shipmentNo)) found[r.company].push(r.shipmentNo); });
    const inP = all.filter(r => r.company === primary), inO = all.filter(r => r.company !== primary);
    let reg = [], status, company = null;
    if (inP.length) {
      reg = inP; status = 'matched'; company = primary;
      if (inO.length) issues.push({ sev: 'err', code: 'both', msg: `AWB is also in ${[...new Set(inO.map(r => r.company))].join(', ')} register` });
    } else if (inO.length) {
      reg = inO; status = 'othco'; company = inO[0].company;
    } else {
      const alt = bySerial.get(row.serial) || [];
      if (alt.length) {
        reg = alt; status = 'airline'; company = alt[0].company;
        issues.push({ sev: 'err', code: 'airline', msg: `Serial found in register under airline prefix ${[...new Set(alt.map(a => a.prefix))].join('/')} (${[...new Set(alt.map(a => a.airline))].join('/')}), CASS bills it under ${row.prefix}` });
      } else {
        status = 'missing';
        issues.push({ sev: 'err', code: 'missing', msg: covers ? 'AWB not found in any loaded register' : 'AWB not found — the register does not cover this execution date' });
      }
    }
    let rates = null, regWeight = null;
    if (reg.length) {
      if (o.flags.dest && !reg.some(r => r.dischCode === row.dst)) issues.push({ sev: 'err', code: 'dest', msg: `Destination: CASS ${row.dst}, register ${[...new Set(reg.map(r => r.dischCode || '—'))].join('/')}` });
      if (o.flags.orig && !reg.some(r => r.loadCode === row.org)) issues.push({ sev: 'warn', code: 'orig', msg: `Origin: CASS ${row.org}, register ${[...new Set(reg.map(r => r.loadCode || '—'))].join('/')}` });
      const st = reg.find(r => /cancel|void|reject|deleted/i.test(r.status));
      if (st && o.flags.cancelled) issues.push({ sev: 'err', code: 'status', msg: `Register shipment ${st.shipmentNo} is “${st.status}”` });
      if (reg.length > 1) {
        const direct = reg.every(r => /direct/i.test(r.consol));
        if (direct) { if (o.flags.dupDirect) issues.push({ sev: 'warn', code: 'dup', msg: `${reg.length} direct shipments share this AWB` }); }
        else issues.push({ sev: 'info', code: 'consol', msg: `Consol AWB — ${reg.length} house shipments` });
      }
      /* chargeable weight */
      const creditOnly = row.adj && row.rateBasis == null;
      if (creditOnly) issues.push({ sev: 'info', code: 'credit', msg: 'Credit-only adjustment (reversal with no re-bill) — weight and rate not compared' });
      else if (reg.every(r => r.weight != null)) {
        regWeight = r2(reg.reduce((s, r) => s + r.weight, 0));
        if (o.flags.weight && Math.abs(regWeight - row.weight) > o.weightTol + 1e-9) issues.push({ sev: 'err', code: 'weight', msg: `Chargeable weight: CASS ${row.weight} kg, register ${regWeight} kg (${r2(regWeight - row.weight) > 0 ? '+' : ''}${r2(regWeight - row.weight)})` });
      } else if (o.flags.weight) issues.push({ sev: 'warn', code: 'weight', msg: 'Chargeable weight not entered in the register' });
      /* rates: CASS (net before tax ÷ chargeable weight) vs register buy; sell for gain */
      const cassRate = (!creditOnly && row.weight > 0) ? r2((row.adj ? row.rateBasis : row.netBefore) / row.weight) : null;
      /* a register buy above lumpMin is the amount for that house (a lump sum), not a per-kg rate */
      const lumpMin = o.lumpMin || 0, isLump = r => lumpMin > 0 && r.buyRate != null && r.buyRate > lumpMin;
      const rowAmt = r => r.buyRate == null ? null : (isLump(r) ? r.buyRate : (r.weight != null ? r.buyRate * r.weight : null));
      const regK = reg.map(r => Object.assign({}, r, { buyKg: r.buyRate == null ? null : (isLump(r) ? (r.weight > 0 ? r.buyRate / r.weight : null) : r.buyRate) }));
      const buy = wAvg(regK, 'buyKg'), sell = wAvg(reg, 'sellRate');
      const amtOk = reg.every(r => rowAmt(r) != null);
      const buyAmt = amtOk ? r2(reg.reduce((a, r) => a + rowAmt(r), 0)) : null;     // register buy for each house (rate x chargeable weight, or the lump sum), added up
      const cassAmt = creditOnly ? null : r2(row.adj ? row.rateBasis : row.netBefore);
      const amtDiff = (buyAmt != null && cassAmt != null) ? r2(cassAmt - buyAmt) : null;       // CASS minus register
      rates = { cass: cassRate, buy, sell, buyAmt, cassAmt, amtDiff, buyLump: reg.some(isLump), buyGap: (buy != null && cassRate != null) ? r2(cassRate - buy) : null,
        regMargin: (sell != null && buy != null) ? r2(sell - buy) : null,
        gainKg: (sell != null && cassRate != null) ? r2(sell - cassRate) : null,
        gainPct: (sell > 0 && cassRate != null) ? r2((sell - cassRate) / sell * 100) : null,
        gainAmt: (sell != null && cassRate != null) ? r2((sell - cassRate) * row.weight) : null,
        sellAmt: sell != null ? r2(sell * row.weight) : null };
      if (cassRate != null) {
        if (buy == null && reg.every(r => r.buyRate != null)) { /* a lump sum with no weight: there is no per-kg rate to compare */ }
        else if (buy == null) {
          const common = reg.every(r => r.buyNote === 'common');
          rates.buyNote = common ? 'common' : 'blank';
          if (common) issues.push({ sev: 'info', code: 'buymiss', msg: 'Buy rate is “Common Job”: the rate sits on another job' });
          else if (o.flags.buyMissing) issues.push({ sev: 'warn', code: 'buymiss', msg: 'Buy rate not entered in the register' });
        } else if (o.flags.buy && Math.abs(cassRate - buy) > o.rateTol + 0.005) {
          issues.push({ sev: 'warn', code: 'buy', msg: `Buy rate: CASS ${cassRate.toFixed(2)}/kg (net before tax ÷ weight), ${rates.buyLump ? `register buy is a lump sum of ${buyAmt.toFixed(2)}, which is ${buy.toFixed(2)}/kg` : `register buy ${buy.toFixed(2)}/kg`} (${rates.buyGap > 0 ? '+' : ''}${rates.buyGap.toFixed(2)})` });
        }
      }
      if (o.flags.amtDiff != null && amtDiff != null && Math.abs(amtDiff) >= o.flags.amtDiff) issues.push({ sev: 'warn', code: 'amt', msg: `Amount: CASS ${cassAmt.toFixed(2)} vs register buy ${rates.buyLump ? 'amount (a lump sum)' : '× weight'} ${buyAmt.toFixed(2)} (difference ${amtDiff > 0 ? '+' : ''}${amtDiff.toFixed(2)})` });
      if (sell == null && !reg.every(r => r.sellNote === 'common')) issues.push({ sev: o.flags.sellMissing ? 'warn' : 'info', code: 'sell', msg: 'Sell rate not entered — gain cannot be worked out' });
      if (!row.adj && rates.gainPct != null) {
        if (o.flags.gainLow != null && rates.gainPct < o.flags.gainLow) issues.push({ sev: 'warn', code: 'gainlow', msg: `Gain ${rates.gainPct.toFixed(2)}% is below your minimum of ${o.flags.gainLow}%` });
        if (o.flags.gainHigh != null && rates.gainPct > o.flags.gainHigh) issues.push({ sev: 'warn', code: 'gainhigh', msg: `Gain ${rates.gainPct.toFixed(2)}% is above your maximum of ${o.flags.gainHigh}%` });
      }
      if (o.flags.date && row.execDate) {
        const ds = reg.map(r => r.shipDate).filter(Boolean);
        if (ds.length && ds.every(d => Math.abs(dayDiff(row.execDate, d)) > o.dateDays))
          issues.push({ sev: 'warn', code: 'date', msg: `Dates: CASS executed ${row.execDate}, register shipment dated ${ds[0]}` });
      }
    }
    let quote = null, quoteWhy = null;
    if (o.pricing && reg.length && !row.adj && rates) {
      const f = findQuotes(o.pricing, row, reg);
      if (f.quote) {
        const qd = f.quote;
        quote = Object.assign(qd, { person: [...new Set(qd.houses.filter(h => h.inq).map(h => pricingPerson(h.inq, o.pricing.team)).filter(Boolean))].join(' | '),
          buyDiffKg: (qd.buy != null && rates.cass != null) ? r2(rates.cass - qd.buy) : null,
          amtDiff: (qd.buyAmt != null && rates.cassAmt != null) ? r2(rates.cassAmt - qd.buyAmt) : null,
          sellDiffKg: (qd.sell != null && rates.sell != null) ? r2(rates.sell - qd.sell) : null });
        if (o.flags.quoteDiff != null && quote.amtDiff != null && Math.abs(quote.amtDiff) >= o.flags.quoteDiff)
          issues.push({ sev: 'warn', code: 'quote', msg: `Quote ${quote.inq}: CASS ${rates.cassAmt.toFixed(2)} vs quoted buy × weight ${quote.buyAmt.toFixed(2)} (difference ${quote.amtDiff > 0 ? '+' : ''}${quote.amtDiff.toFixed(2)})` });
      } else quoteWhy = f.why;
    }
    let actual = null;
    if (o.actual && !row.adj) {
      actual = linkActual(o.actual.act, o.actual.sel, row, reg, quote);
      if (!actual.found) { if (o.flags.bookedDiff != null) issues.push({ sev: 'warn', code: 'abook', msg: 'Not in the actual billing report: no job found for this AWB' }); }
      else {
        if (o.flags.bookedDiff != null && Math.abs(actual.costDiff) >= o.flags.bookedDiff) issues.push({ sev: 'warn', code: 'abook', msg: `Booked cost ${actual.cost.toFixed(2)} vs CASS ${row.netBefore.toFixed(2)} (CASS minus booked ${actual.costDiff > 0 ? '+' : ''}${actual.costDiff.toFixed(2)})` });
        if (o.flags.lossLine && actual.billed < row.netBefore) issues.push({ sev: 'warn', code: 'aloss', msg: `Billed ${actual.billed.toFixed(2)} is below the IATA cost ${row.netBefore.toFixed(2)}` });
      }
    }
    const worst = issues.reduce((w, i) => i.sev === 'err' ? 2 : (i.sev === 'warn' && w < 1 ? 1 : w), 0);
    const final = status === 'missing' ? 'missing' : status === 'othco' ? 'othco' : status === 'airline' ? 'exception' : worst === 2 ? 'exception' : worst === 1 ? 'review' : 'ok';
    return { cass: row, reg, status: final, issues, rates, regWeight, company, found, quote, quoteWhy, actual, otherReg: inP.length ? inO : [] };       // otherReg: the same AWB in the other company's register
  });
  if (registers.length && out.some(x => x.status === 'missing') && companies.length < 2)
    scopeMsgs.push({ sev: 'info', text: `${out.filter(x => x.status === 'missing').length} AWBs are not in this register. If they belong to your other company, add that company's register too.` });

  /* register-only: shipments on airline + origin pairs billed here, with no CASS line */
  const cassKeys = new Set(cass.rows.map(r => r.awb11)), cassSerials = new Set(cass.rows.map(r => r.serial));
  const pairs = new Set(cass.rows.map(r => r.prefix + '|' + r.org));
  const nameCount = {};
  regRows.forEach(r => { if (r.prefix && r.airline) { (nameCount[r.airline] = nameCount[r.airline] || {})[r.prefix] = ((nameCount[r.airline] || {})[r.prefix] || 0) + 1; } });
  const nameToPrefix = {}; Object.entries(nameCount).forEach(([n, m]) => nameToPrefix[n] = Object.entries(m).sort((a, b) => b[1] - a[1])[0][0]);
  const groups = new Map();
  regRows.forEach(r => {
    const prefix = r.prefix || nameToPrefix[r.airline] || '';
    if (!pairs.has(prefix + '|' + r.loadCode)) return;
    if (r.awb11 && (cassKeys.has(r.awb11) || cassSerials.has(r.serial))) return;
    const key = r.awb11 || ('noawb:' + r.src + r.shipmentNo);
    (groups.get(key) || groups.set(key, []).get(key)).push(Object.assign({}, r, { prefix }));
  });
  const regOnly = [];
  groups.forEach((rs, key) => {
    const flown = rs.map(r => r.atd || r.etd || r.shipDate).filter(Boolean).sort()[0] || null;
    let kind, reason;
    if (flown && from && flown < addDays(from, -o.leadDays)) return;       // billed in an earlier cycle we don't have
    if (!rs[0].awb11) { kind = 'noawb'; reason = 'No AWB number in the register yet'; }
    else if (flown && to && flown > to) { kind = 'next'; reason = `Flies ${flown}, after the CASS period — expect it in the next cycle`; }
    else { kind = 'due'; reason = 'Flown within the period but not billed in this CASS — check with the airline'; }
    regOnly.push({ key, reg: rs, prefix: rs[0].prefix, airline: rs[0].airline, awb: rs[0].awbRaw, company: rs[0].company, flown, kind, reason });
  });
  regOnly.sort((a, b) => (a.kind > b.kind ? 1 : a.kind < b.kind ? -1 : 0) || String(a.flown).localeCompare(String(b.flown)));

  /* summary */
  const cnt = s => out.filter(x => x.status === s).length;
  const sumPay = f => r2(out.filter(f).reduce((s, x) => s + x.cass.netPayable, 0));
  const byAirline = cass.invoices.map(inv => {
    const rs = out.filter(x => x.cass.invoiceNo === inv.invoiceNo);
    const g = rs.filter(x => x.rates && x.rates.gainAmt != null && !x.cass.adj);
    return { airlineCode: inv.airlineCode, prefix: inv.prefix, invoiceNo: inv.invoiceNo, bill: inv.bill, lines: rs.length,
      ok: rs.filter(x => x.status === 'ok').length, review: rs.filter(x => x.status === 'review').length,
      exception: rs.filter(x => x.status === 'exception').length, void: rs.filter(x => x.status === 'void').length, othco: rs.filter(x => x.status === 'othco').length, missing: rs.filter(x => x.status === 'missing').length,
      payable: r2(rs.reduce((s, x) => s + x.cass.netPayable, 0)),
      gainAmt: r2(g.reduce((s, x) => s + x.rates.gainAmt, 0)), sellAmt: r2(g.reduce((s, x) => s + x.rates.sellAmt, 0)) };
  });
  const gl = out.filter(x => x.rates && x.rates.gainAmt != null && x.status !== 'missing' && !x.cass.adj);
  const gainAmt = r2(gl.reduce((s, x) => s + x.rates.gainAmt, 0)), sellAmt = r2(gl.reduce((s, x) => s + x.rates.sellAmt, 0));
  const summary = { lines: out.length, ok: cnt('ok'), review: cnt('review'), exception: cnt('exception'), othco: cnt('othco'), missing: cnt('missing'), void: cnt('void'),
    regOnlyDue: regOnly.filter(x => x.kind === 'due').length, regOnlyNext: regOnly.filter(x => x.kind === 'next').length, regOnlyNoAwb: regOnly.filter(x => x.kind === 'noawb').length,
    payableTotal: sumPay(() => true), payableMissing: sumPay(x => x.status === 'missing'), payableOther: sumPay(x => x.status === 'othco'),    gainAmt, sellAmt, gainPct: sellAmt > 0 ? r2(gainAmt / sellAmt * 100) : null, gainLines: gl.length,
    adjLines: out.filter(x => x.cass.adj).length, regRows: regRows.length, covers, primary, companies };
  return { rows: out, regOnly, byAirline, summary, scopeMsgs, opts: o, primary, companies };
}


/* ---------- Purchase upload (ERP template "All Fields") ---------- */
const PURCHASE_HEADERS = ['Entry\u00a0Date', 'Posting\u00a0Date', 'Organization', 'Organization Branch', 'Vendor Inv No', 'Vendor Inv Date', 'Currency', 'ExchRate', 'Narration', 'Due Date',
  'Charge or GL', 'Charge or GL Name', 'Charge or GL Amount', 'DR or CR', 'Cost Center', 'Branch', ' Charge Narration', 'TaxGroup', 'Tax Type', 'SAC or HSN', 'Taxcode1', 'Taxcode1 Amt',
  'Taxcode2', 'Taxcode2 Amt', 'Taxcode3', 'Taxcode3 Amt', 'Taxcode4', 'Taxcode4 Amt', 'Avail Tax Credit', 'LOB', 'Ref Type', 'Ref No', 'Amount ', 'Start Date', 'End Date',
  'WH Tax Code', 'WH Tax Percentage', 'WH Tax Taxable', 'WH Tax Amount', 'Round Off', 'CC Code'];
const PURCHASE_FIXED = { currency: 'INR', exch: 1, chargeOrGl: 'Charge', chargeName: 'Air Freight Export', costCenter: 'Air Export', taxType: 'TAXABLE', sac: '996531', itc: '100', lob: 'AIR EXP', roundOff: 'yes' };
const MON3 = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const fmtDate = d => { if (!d) return ''; const p = d.split('-'); return `${p[2]}-${MON3[+p[1] - 1]}-${p[0]}`; };

/* Reads the vendor master and the branch master (either order, any column order) */
function parseMaster(aoa, source) {
  let h = -1, kind = null, cells = [];
  for (let i = 0; i < Math.min(aoa.length, 15); i++) {
    cells = (aoa[i] || []).map(normH);
    if (cells.includes('vendorcode') && cells.some(c => c === 'tax id' || c === 'gstin')) { h = i; kind = 'vendor'; break; }
    if (cells.some(c => c === 'branch uuid' || c === 'branch gstin') && cells.includes('branch')) { h = i; kind = 'branch'; break; }
  }
  if (h < 0) throw new Error(source + ': not a vendor master (needs VendorCode and Tax ID) or a branch master (needs Branch and Branch UUID).');
  const ix = names => cells.findIndex(c => names.includes(c));
  const rows = [];
  if (kind === 'vendor') {
    const c = { code: ix(['vendorcode']), doc: ix(['vendorname document', 'vendor name document']), erp: ix(['vendorname erp', 'vendor name erp']), tax: ix(['tax id', 'gstin']), branch: ix(['branch erp', 'branch']), wh: ix(['tax code']) };
    for (let i = h + 1; i < aoa.length; i++) {
      const r = aoa[i]; if (!r || !String(r[c.tax] || '').trim()) continue;
      rows.push({ code: String(r[c.code] || '').trim(), docName: c.doc >= 0 ? String(r[c.doc] || '').trim() : '', erpName: String(r[c.erp] || '').trim(), taxId: String(r[c.tax]).trim().toUpperCase(), branch: String(r[c.branch] || '').trim(), whCode: c.wh >= 0 ? String(r[c.wh] || '').trim() : '' });
    }
  } else {
    const c = { company: ix(['companyname', 'company name', 'company']), branch: ix(['branch']), gstin: ix(['branch uuid', 'branch gstin']) };
    for (let i = h + 1; i < aoa.length; i++) {
      const r = aoa[i]; if (!r || !String(r[c.gstin] || '').trim()) continue;
      rows.push({ company: c.company >= 0 ? String(r[c.company] || '').trim() : '', branch: String(r[c.branch] || '').trim(), gstin: String(r[c.gstin]).trim().toUpperCase() });
    }
  }
  return { kind, source, rows };
}

const PURCHASE_DEFAULTS = { entryDate: null, postingDate: null, dueMode: 'remit', dueDays: 45, includeAdj: true, commonJobs: {},
  narration: 'BEING AIR FRT CHGS FOR {period} AS PER {airline} AS PER INV.' };

/* Turns reconciled CASS lines into purchase-upload rows. Every CASS line ends up either in `rows` or in `left`. */
function buildPurchase(cass, res, masters, optsIn) {
  const o = Object.assign({}, PURCHASE_DEFAULTS, optsIn || {});
  const vendors = (masters.vendors || []), branches = (masters.branches || []);
  const vByGst = new Map(vendors.map(v => [v.taxId, v])), bByGst = new Map(branches.map(b => [b.gstin, b.branch]));
  const invByNo = new Map(cass.invoices.map(i => [i.invoiceNo, i]));
  const rows = [], left = [], warnings = [];
  const fc = o.forCompany || '';                          // provision entries for the other company: its lines only (found only in its register)
  const mine = rr => !fc || (rr.status === 'othco' && rr.company === fc);
  const posting = o.postingDate || o.entryDate;
  const fy = posting ? (+posting.slice(5, 7) >= 4 ? [posting.slice(0, 4) + '-04-01', (+posting.slice(0, 4) + 1) + '-03-31'] : [(+posting.slice(0, 4) - 1) + '-04-01', posting.slice(0, 4) + '-03-31']) : ['', ''];
  const periodTxt = inv => { if (!inv.periodFrom) return ''; const a = inv.periodFrom.split('-'), b = inv.periodTo.split('-'); return a[1] === b[1] ? `${a[2]}/${b[2]}-${b[1]}-${b[0].slice(2)}` : `${a[2]}-${a[1]}/${b[2]}-${b[1]}-${b[0].slice(2)}`; };
  const addDays2 = (d, n) => addDays(d, n);
  const notedVendors = new Set();

  res.rows.forEach(rr => {
    if (!mine(rr)) return;
    const x = rr.cass, inv = invByNo.get(x.invoiceNo) || {};
    const base = { awb: x.awb, invoiceNo: x.invoiceNo, airline: x.airlineCode, bill: x.bill, netBefore: x.netBefore, gst: x.gst && isFinite(x.gst.gst) ? x.gst.gst : 0 };
    const out = reason => left.push(Object.assign({ reason, company: rr.company || '', shipment: rr.reg[0] ? rr.reg[0].shipmentNo : '' }, base));
    if (rr.status === 'void') return out('Void AWB, nothing billed');
    if (Math.abs(x.netBefore) < 0.005) return out('Net amount is zero (reversal and re-bill are identical)');
    if (x.adj && !o.includeAdj) return out('Adjustment bill, not included');
    if (!fc && rr.status === 'othco') return out('Belongs to the other company (' + (rr.company || '') + ')');
    if (rr.issues.some(i => i.code === 'airline')) return out('Found in the register under a different airline');
    const v = vByGst.get(x.vendorGstin);
    if (!v) { if (!notedVendors.has(x.vendorGstin)) { notedVendors.add(x.vendorGstin); warnings.push(`Airline GSTIN ${x.vendorGstin || '(not read)'} (invoice ${x.invoiceNo}) is not in the vendor master.`); } return out('Airline GSTIN not in the vendor master'); }
    let agentBranch = '';
    if (fc && o.provBranch !== 'bill') {            // the company's own register names the branch (the CASS bill is addressed to the other company)
      const bs = [...new Set(rr.reg.map(r => String(rawValue(r, 'Branch') || '').trim()).filter(Boolean))];
      if (!bs.length) return out('No branch in the ' + fc + ' register');
      if (bs.length > 1) return out('The houses are in different branches (' + bs.join(', ') + ')');
      agentBranch = bs[0];
    } else {
      agentBranch = bByGst.get(x.agentGstin) || '';
      if (!agentBranch) { return out('Agent GSTIN ' + (x.agentGstin || '') + ' not in the branch master'); }
    }
    let refType = '', refNo = '', branch = agentBranch, note = '';
    if (rr.status === 'missing') {
      const cj = o.commonJobs[(x.bill || '').replace(/ adj$/, '') + '|' + (inv.periodFrom || '')];
      if (!cj || !cj.job) return out('No job in any loaded register (no common job set)');
      refType = 'SHP'; refNo = cj.job; branch = cj.branch || agentBranch; note = 'common job';
    } else if (rr.reg.some(r => /consol/i.test(r.consol)) || rr.reg.some(r => r.consolJob && !rr.reg.some(x => x.shipmentNo === r.consolJob))) {
      // a master AWB is one consol job: its houses (one shipment each) must all sit under the same consol number.

/* ================= registers (same reader as the IATA tool) ================= */
App.addRegisters=async function(files,slot){
  say('Reading register…','ok');
  for(const f of files){
    try{
      const wb=XLSX.read(new Uint8Array(await readBuf(f)),{type:'array',bookFiles:true});
      let sst=''; try{const e=wb.files&&wb.files['xl/sharedStrings.xml']; if(e) sst=new TextDecoder().decode(e.content);}catch(_){}
      let names=wb.SheetNames.filter(n=>/^(ngl?|ncs|new globe|neutral)/i.test(n));
      if(!names.length) names=[wb.SheetNames[0]];
      for(const sn of names){
        const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,dateNF:'yyyy-mm-dd',defval:''});
        const src=f.name+(wb.SheetNames.length>1?' · '+sn:'');
        const fb=(/^ncs/i.test(sn)?SLOTS.ncs.company:/^ngl?$|new globe/i.test(sn)?SLOTS.ng.company:SLOTS[slot||'ng'].company);
        const reg=Core.parseRegister(aoa,src,sst,{company:fb});
        reg._aoa=aoa; reg._sst=sst; reg._fb=fb; reg._opts={}; reg.id=App.nextId++; reg.fileName=f.name; reg.sheet=sn;
        reg.slot=slotOfCompany(reg.company)||slot||'ng';
        if(reg.problem&&!reg.rows.length){say('"'+src+'": '+reg.problem,'err');continue;}
        const old=App.regs.findIndex(r=>r.source===src); if(old>=0)App.regs[old]=reg; else App.regs.push(reg);
      }
    }catch(e){say('Could not read "'+f.name+'": '+e.message,'err');}
  }
  renderFiles(); if(!$('msg').classList.contains('err')) say('Register loaded: '+App.regs.map(r=>shortCo(r.company)+' '+r.rows.length.toLocaleString('en-IN')+' rows').join(', '),'ok');
};
App.reparse=function(id,key,val){
  const i=App.regs.findIndex(r=>r.id===id),reg=App.regs[i]; const mapping=Object.assign({},reg._opts.mapping||{}); mapping[key]=+val;
  const n=Core.parseRegister(reg._aoa,reg.source,reg._sst,{mapping:mapping,company:reg._fb});
  Object.assign(n,{_aoa:reg._aoa,_sst:reg._sst,_fb:reg._fb,_opts:{mapping},id:reg.id,fileName:reg.fileName,sheet:reg.sheet,slot:reg.slot}); App.regs[i]=n; renderFiles();
};
App.removeReg=id=>{App.regs=App.regs.filter(r=>r.id!==id);renderFiles();};

/* ================= job profit report ================= */
App.addActual=async function(files,slot){
  say('Reading job profit report…','ok');
  for(const f of files){
    try{
      const buf=new Uint8Array(await readBuf(f)); const names=XLSX.read(buf,{type:'array',bookSheets:true}).SheetNames;
      const wb=XLSX.read(buf,{type:'array',sheets:names});
      const sheets=names.map(n=>{const ws=wb.Sheets[n];if(!ws||!ws['!ref'])return{name:n,aoa:[]};trimSheet(ws);return{name:n,aoa:XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''})};});
      const P=Core.parseActual(sheets,f.name);
      if(!P.rows.length) throw new Error('no job rows found. The report needs Job No., Charge and Income columns.');
      P.slot=slot||'ng'; if(P.company){const k=slotOfCompany(P.company);if(k)P.slot=k;} else P.company=SLOTS[P.slot].company;
      App.actFiles=App.actFiles.filter(x=>x.fileName!==f.name).concat([P]);
    }catch(e){say('Could not read "'+f.name+'": '+e.message,'err');}
  }
  rebuildActual(); renderFiles();
};
function rebuildActual(){
  App.actual=App.actFiles.length?Core.buildActual(App.actFiles):null;
  if(App.actual){const names=new Set(App.actual.charges.map(c=>c.name)); if(App.headsTouched){const keep=[...App.heads].filter(h=>names.has(h)); App.heads=new Set(keep.length?keep:Core.defaultHeads(App.actual.charges));} else App.heads=new Set(Core.defaultHeads(App.actual.charges));}
  else App.heads=new Set();
}
App.toggleHead=(h,on)=>{App.headsTouched=true;if(on)App.heads.add(h);else App.heads.delete(h);$('headsCount').textContent=App.heads.size+' of '+App.actual.charges.length+' charge heads ticked';};
App.removeAct=i=>{App.actFiles.splice(i,1);rebuildActual();renderFiles();};

/* ================= pricing sheet ================= */
App.addPricing=async function(files){
  say('Reading pricing sheet… about ten seconds per file.','ok');
  for(const f of files){
    try{
      const buf=new Uint8Array(await readBuf(f));
      const names=XLSX.read(buf,{type:'array',bookSheets:true}).SheetNames.filter(n=>!/^(total data|data sheet)$/i.test(n));
      const wb=XLSX.read(buf,{type:'array',sheets:names});
      const sheets=names.map(n=>{const ws=wb.Sheets[n];if(!ws||!ws['!ref'])return{name:n,aoa:[]};trimSheet(ws);return{name:n,aoa:XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'yyyy-mm-dd',defval:''})};});
      const P=Core.parsePricing(sheets);
      if(!P.quotes.length) throw new Error('No RFQ rows found. The sheets need INQ NO and RFQ DATE columns.');
      P.fileName=f.name; App.pricingFiles=App.pricingFiles.filter(x=>x.fileName!==f.name).concat([P]);
    }catch(e){say('Could not read "'+f.name+'": '+e.message,'err');}
  }
  rebuildPricing(); renderFiles(); if(!$('msg').classList.contains('err')) say('Pricing sheet loaded: '+(App.quotes?App.quotes.quotes.length.toLocaleString('en-IN')+' quotes':''),'ok');
};
function rebuildPricing(){
  if(!App.pricingFiles.length){App.quotes=null;return;}
  const m=new Map(); App.pricingFiles.forEach(P=>P.quotes.forEach(q=>m.set(q.inq,q)));
  const quotes=[...m.values()]; App.quotes={quotes,info:App.pricingFiles.flatMap(P=>P.info),won:quotes.filter(q=>q.status==='WON').length,files:App.pricingFiles.map(P=>({name:P.fileName,n:P.quotes.length}))};
}
App.removePricing=i=>{App.pricingFiles.splice(i,1);rebuildPricing();renderFiles();};


/* ================= OCR for scanned bills (loaded only when a PDF has no text) ================= */
let ocrWorker=null;
async function loadTesseract(){
  if(window.Tesseract)return window.Tesseract;
  await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=res;s.onerror=()=>rej(new Error('the OCR library did not load, check the internet connection'));document.head.appendChild(s);});
  return window.Tesseract;
}
async function getOcr(){
  if(ocrWorker)return ocrWorker;
  const T=await loadTesseract();
  ocrWorker=await T.createWorker('eng',1,{workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int',gzip:true});
  return ocrWorker;
}
async function ocrPdf(buf){
  const w=await getOcr(),doc=await window.pdfjsLib.getDocument({data:buf}).promise,L=[];
  for(let p=1;p<=Math.min(doc.numPages,2);p++){
    const page=await doc.getPage(p),vp=page.getViewport({scale:2.5}),cv=document.createElement('canvas');cv.width=Math.ceil(vp.width);cv.height=Math.ceil(vp.height);
    await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    const r=await w.recognize(cv);
    r.data.text.split('\n').map(s=>s.trim()).filter(Boolean).forEach(l=>L.push(l));L.push('\f');
  }
  return L;
}

/* ================= GSA invoices: PDFs and Excel lines ================= */
App.addInvoices=async function(files){
  say('Reading invoice files…','ok');
  for(const f of files){
    try{
      const wb=XLSX.read(new Uint8Array(await readBuf(f)),{type:'array',cellDates:true}); const sheets={};
      wb.SheetNames.forEach(sn=>{const p=E.parseInvoiceSheet(rows2(wb.Sheets[sn]));if(!p.error)sheets[sn]=p;});
      const names=Object.keys(sheets);
      if(!names.length){say('No invoice layout found in "'+f.name+'". It needs a header row containing Invoice no and AWB columns. Use the template.','err');continue;}
      App.inv.push({id:App.nextId++,file:f.name,sheets,sheet:names[0],mapping:Object.assign({},sheets[names[0]].mapping)});
    }catch(e){say('Could not read "'+f.name+'": '+e.message,'err');}
  }
  renderFiles();
};
App.remove=function(kind,id){App[kind]=App[kind].filter(x=>x.id!==id);renderFiles();};
App.setInvSheet=function(id,sn){const r=App.inv.find(x=>x.id===id);r.sheet=sn;r.mapping=Object.assign({},r.sheets[sn].mapping);renderFiles();};
App.setInvMap=function(id,k,v){App.inv.find(x=>x.id===id).mapping[k]=+v;renderFiles();};
App.setNature=v=>{App.nature=v;renderFiles();};
App.addPdfs=async function(files){
  const pdfjs=window.pdfjsLib;
  if(!pdfjs){say('The PDF reader did not load. Check the internet connection and reload.','err');return;}
  const kf=f=>f.name+'|'+f.size, seen=new Set(App.pdf.docs.map(d=>d.key).concat(App.pdf.skipped.map(d=>d.key)));
  const list=files.filter(f=>/\.pdf$/i.test(f.name)&&!seen.has(kf(f)));
  let n=0;
  for(const f of list){
    say('Reading PDFs: '+(++n)+' of '+list.length,'ok');
    try{
      const buf=new Uint8Array(await readBuf(f)),bufOcr=buf.slice();   // the PDF reader takes over its buffer, so keep a copy for OCR
      const pages=await window.PDFText.pdfToLines(pdfjs,buf);let L=pages.flat(),text=L.join('\n'),ocr=false;
      if(!text.trim()){
        say('Reading a scanned bill by OCR: '+f.name+' (the first one loads the OCR library, about 10 MB)…','ok');
        try{L=await ocrPdf(bufOcr);text=L.join('\n');ocr=true;}
        catch(e){App.pdf.skipped.push({file:f.name,key:kf(f),vendor:'',reason:'Scanned image, and OCR could not run: '+e.message});continue;}
        if(!X.detect(text)){App.pdf.skipped.push({file:f.name,key:kf(f),vendor:X.guessVendor(text),reason:X.skipReason(text)||'Scanned image read by OCR, but it is not a bill the tool knows'});continue;}
      }
      const p=X.detect(text);
      if(!p){App.pdf.skipped.push({file:f.name,key:kf(f),vendor:X.guessVendor(text),reason:X.skipReason(text)||'No reader for this layout yet'});continue;}
      if(p.support){App.pdf.skipped.push({file:f.name,key:kf(f),vendor:p.name,reason:'Supporting report: the invoices carry the same AWBs'});continue;}
      App.pdf.docs.push({file:f.name,key:kf(f),parser:p,doc:p.parse(L)});
    }catch(e){App.pdf.skipped.push({file:f.name,key:kf(f),vendor:'',reason:'Could not read: '+e.message});}
  }
  App.refreshPdf(); const r=App.pdf.result;
  say('Read '+list.length+' PDF'+(list.length===1?'':'s')+': '+r.invoices.length+' invoices, '+r.lines.length+' AWB lines.','ok'); renderFiles();
};
App.refreshPdf=()=>{App.pdf.result=X.finalize(App.pdf.docs,App.pdf.opt);};
App.setTds=(k,v)=>{App.pdf.opt[k]=Number(v);App.refreshPdf();renderFiles();};
App.clearPdfs=()=>{App.pdf.docs=[];App.pdf.skipped=[];App.pdf.result={invoices:[],lines:[]};renderFiles();};
function invLines(){const out=[];App.inv.forEach(r=>{E.extractLines(r.sheets[r.sheet],r.mapping,{nature:App.nature}).forEach(l=>{l.file=r.file;out.push(l);});});App.pdf.result.lines.forEach(l=>out.push(Object.assign({},l)));return out;}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());}
function dl(buf,name){
  if(App.download){App.download(buf,name);return;}
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
function needXl(){if(!window.ExcelJS||!window.GSAXlsx){say('The Excel library did not load. Check the internet connection and reload.','err');return false;}return true;}
App.ocrPdf=ocrPdf;
App.exportExtract=async function(){

  try{const wb=window.GSAXlsx.buildLinesWorkbook(window.ExcelJS,{lines:App.pdf.result.lines,invoices:App.pdf.result.invoices,skipped:App.pdf.skipped,tds:App.pdf.opt});

  }catch(e){console.error(e);say('Export failed: '+e.message,'err');}

function renderFiles(){
  const lines=(App.inv.length||App.pdf.result.lines.length)?invLines().length:0;
  const miss=[]; App.inv.forEach(r=>{E.INV_FIELDS.filter(f=>f.req&&r.mapping[f.k]<0).forEach(f=>miss.push(r.file+': map '+f.label));});
  const ready=App.regs.length&&lines&&!miss.length;
  const invHtml=App.inv.map(r=>{const p=r.sheets[r.sheet];const maps=E.INV_FIELDS.map(f=>'<label class="field">'+esc(f.label)+(f.req?' (required)':'')+'<select onchange="App.setInvMap('+r.id+',\''+f.k+'\',this.value)">'+optList(p.headers,r.mapping[f.k])+'</select></label>').join('');
    const names=Object.keys(r.sheets),n=E.extractLines(p,r.mapping,{nature:App.nature}).length;

function wireDrops(){
  const bind=(drop,inp,fn)=>{const d=$(drop),i=$(inp);if(!d)return;i.addEventListener('change',()=>{fn([...i.files]);i.value='';});['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over');}));['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over');}));d.addEventListener('drop',e=>{fn([...e.dataTransfer.files]);});};
  ['ng','ncs'].forEach(s=>{bind('dropReg'+s,'fReg'+s,f=>App.addRegisters(f,s));bind('dropAct'+s,'fAct'+s,f=>App.addActual(f,s));});
  bind('dropPdf','fPdf',App.addPdfs); bind('dropInv','fInv',App.addInvoices); bind('dropPricing','fPricing',App.addPricing);
}

/* ================= run ================= */
App.run=function(){
  try{
    const lines=invLines(); if(!lines.length){say('No invoice lines found. Check the nature filter and the column mapping.','err');return;}
    if(!App.regs.length){say('Load a register first.','err');return;}
    if(App.d1.on&&(!App.d1.from||!App.d1.to)){say('The unbilled check is on: set From and To dates in the Rules tab, or switch it off.','err');return;}
    const o=Object.assign({},App.opts,{flags:Object.assign({},App.opts.flags),primary:App.primary||null});
    if(App.quotes) o.pricing=Core.makePricing(App.quotes.quotes,Core.PRICING_TEAM_DEFAULT,{fuzzy:false,lumpMin:App.pLump});
    if(App.actual) o.actual={act:App.actual,sel:new Set([...App.heads].map(h=>h.trim().toLowerCase()))};
    const res=G.reconcile(lines,App.regs,o);
    App.res=res; App.sum=G.summarize(res); App.unb=App.d1.on?G.unbilled(lines,App.regs,App.d1.from,App.d1.to,App.d1.basis):null;
    App.runInfo={when:new Date(),regFiles:App.regs.map(r=>r.source),invFiles:App.inv.map(x=>x.file).concat(App.pdf.docs.length?[App.pdf.docs.length+' PDFs']:[]),nature:App.nature,actual:App.actFiles.map(f=>f.fileName),pricing:App.pricingFiles.map(f=>f.fileName)};
    App.view=Object.assign(App.view,{status:'',code:'',gsa:'',q:'',limit:500});
    say('Reconciled '+lines.length.toLocaleString('en-IN')+' invoice lines against the register (main company: '+shortCo(res.primary)+').','ok');
    drawTabs(); renderResults(); renderInvoices(); renderSummary(); renderUnbilled(); App.go('results');
  }catch(e){console.error(e);say('Run failed: '+e.message,'err');}
};

  const body=shown.map(x=>{const rt=x.rates||{};
    return '<tr class="'+({ok:'Clear',review:'Warning',exception:'Error',othco:'Warning',missing:'Error',void:'Clear'})[x.status]+'"><td><span class="st s-'+x.status+'">'+STATUS[x.status]+'</span></td><td>'+codeChips(x)+'</td><td>'+esc(x.cass.payee)+'</td><td>'+esc(x.cass.invoiceNo)+'</td><td class="awb">'+esc(x.cass.awb)+'</td><td class="num">'+fmt(x.L.wt)+'</td><td class="num">'+fmt(x.regWeight)+'</td><td class="num">'+fmt(x.cass.netBefore)+'</td><td class="num">'+fmt(rt.cass)+'</td><td class="num">'+fmt(rt.buy)+'</td><td class="num">'+fmt(rt.buyGap)+'</td><td class="num">'+fmt(rt.amtDiff)+'</td><td>'+esc(shortCo(x.company)||'')+'</td><td class="det">'+x.issues.map(i=>'<span class="flagline"><span class="id '+SEVCLS[i.sev]+'">'+i.code+'</span>'+esc(i.msg)+'</span>').join('')+'</td>'+
      opt.map(c=>{const val=c.g(x);return '<td'+(c.n?' class="num"':'')+'>'+(c.n?fmt(val):esc(val===null||val===undefined?'':val))+'</td>';}).join('')+ex.map(h=>'<td>'+esc(regVal(x,h))+'</td>').join('')+'</tr>';}).join('');
  sec.innerHTML=
   '<div class="toolbar"><label class="field">Status<select onchange="App.f(\'status\',this.value)"><option value="">All</option>'+ORDER.filter(s=>res.some(x=>x.status===s)).map(s=>'<option value="'+s+'"'+(v.status===s?' selected':'')+'>'+STATUS[s]+' ('+res.filter(x=>x.status===s).length+')</option>').join('')+'</select></label>'+
   '<label class="field">Reason<select onchange="App.f(\'code\',this.value)"><option value="">All reasons</option>'+G.CODES.filter(c=>counts[c.code]).map(c=>'<option value="'+c.code+'"'+(v.code===c.code?' selected':'')+'>'+c.code+' · '+esc(c.label)+' ('+counts[c.code]+')</option>').join('')+'</select></label>'+
   '<label class="field">GSA<select onchange="App.f(\'gsa\',this.value)"><option value="">All GSAs</option>'+gsas.map(p=>'<option'+(v.gsa===p?' selected':'')+'>'+esc(p)+'</option>').join('')+'</select></label>'+
   '<label class="field">Find AWB, invoice, job or GSA<input type="text" id="fQ" value="'+esc(v.q)+'" oninput="App.f(\'q\',this.value,true)" style="min-width:220px"></label>'+
   '<button class="btn" onclick="App.toggleCols()">Columns</button><button class="btn primary" onclick="App.exportXlsx()">Download Excel</button></div>'+
   '<div class="cols" id="colpanel" hidden><div class="chips">'+OPTCOLS.map(c=>'<label><input type="checkbox" '+(v.cols[c.k]?'checked':'')+' onchange="App.col(\''+c.k+'\',this.checked)">'+esc(c.l)+'</label>').join('')+'</div><details style="margin-top:8px"><summary>Register columns</summary><div class="chips">'+allHeaders().map(h=>'<label><input type="checkbox" '+(v.extra.has(h)?'checked':'')+' onchange="App.extra(\''+esc(h).replace(/'/g,"\\'")+'\',this.checked)">'+esc(h)+'</label>').join('')+'</div></details></div>'+
   '<p class="notice" style="margin-bottom:8px">'+rows.length.toLocaleString('en-IN')+' of '+res.length.toLocaleString('en-IN')+' lines'+(rows.length>shown.length?', showing the first '+shown.length.toLocaleString('en-IN')+' (the Excel download has all of them)':'')+'.</p>'+
   '<div class="tablewrap"><table><thead>'+head+'</thead><tbody>'+(body||'<tr><td colspan="14" class="empty">No lines match these filters.</td></tr>')+'</tbody></table></div>'+(rows.length>shown.length?'<p style="margin-top:12px"><button class="btn" onclick="App.more()">Show 500 more</button></p>':'');
  if(v._focusQ){const q=$('fQ');q.focus();q.setSelectionRange(q.value.length,q.value.length);v._focusQ=false;}
  if(v._cols)$('colpanel').hidden=false;
}
App.f=(k,val,keep)=>{App.view[k]=val;App.view.limit=500;if(keep)App.view._focusQ=true;renderResults();};
App.more=()=>{App.view.limit+=500;renderResults();};
App.col=(k,on)=>{App.view.cols[k]=on;App.view._cols=true;renderResults();};
App.extra=(h,on)=>{if(on)App.view.extra.add(h);else App.view.extra.delete(h);App.view._cols=true;renderResults();};
App.toggleCols=()=>{const p=$('colpanel');p.hidden=!p.hidden;App.view._cols=!p.hidden;};

/* ================= Invoices, Summary, Unbilled ================= */
function invoiceRows(){
  const pdfInv=new Map(App.pdf.result.invoices.map(v=>[(v.invNo||'')+'|'+(v.payee||'').toUpperCase(),v])),m=new Map();
  App.res.rows.forEach(x=>{const k=x.cass.payee+'||'+x.cass.invoiceNo;let v=m.get(k);if(!v){const pv=pdfInv.get((x.cass.invoiceNo||'')+'|'+(x.cass.payee||'').toUpperCase());v={gsa:x.cass.payee,inv:x.cass.invoiceNo,date:x.L.invDate,lines:0,ok:0,review:0,exception:0,othco:0,missing:0,net:0,gst:0,pv};m.set(k,v);}v.lines++;v[x.status]=(v[x.status]||0)+1;v.net+=x.cass.netBefore||0;v.gst+=x.L.gst||0;});
  return [...m.values()];
}
function renderInvoices(){
  const sec=$('v-invoices');if(!App.res){sec.innerHTML='';return;}
  sec.innerHTML='<p class="notice">One row per invoice. The totals check compares the sum of the extracted lines with the totals printed on the PDF invoice.</p><div class="tablewrap"><table><thead><tr><th>Totals check</th><th>GSA</th><th>Invoice no</th><th>Date</th><th class="num">Lines</th><th class="num">Matched</th><th class="num">Needs a look</th><th class="num">Conflict</th><th class="num">Other company</th><th class="num">In no register</th><th class="num">Net before tax</th><th class="num">GST</th></tr></thead><tbody>'+
   invoiceRows().map(v=>{const st=v.pv?v.pv.status:'';return '<tr><td>'+(v.pv?'<span class="st '+(st==='ok'?'Clear':st==='note'?'Warning':'Error')+'">'+(st==='ok'?'OK':st==='note'?'Note':'Check')+'</span>':'<span class="meta">from Excel</span>')+'</td><td>'+esc(v.gsa)+'</td><td>'+esc(v.inv)+'</td><td>'+esc(v.date)+'</td><td class="num">'+v.lines+'</td><td class="num">'+(v.ok||'')+'</td><td class="num">'+(v.review||'')+'</td><td class="num">'+(v.exception||'')+'</td><td class="num">'+(v.othco||'')+'</td><td class="num">'+(v.missing||'')+'</td><td class="num">'+fmt(v.net)+'</td><td class="num">'+fmt(v.gst)+'</td></tr>';}).join('')+'</tbody></table></div>';
}
function renderSummary(){
  const sec=$('v-summary');if(!App.res){sec.innerHTML='';return;}
  const S=App.res.summary,sm=App.sum,rows=App.res.rows;
  const kp=(n,l,c)=>'<div class="kpi '+(c||'')+'"><b>'+n.toLocaleString('en-IN')+'</b><span>'+l+'</span></div>';
  const th=['Lines','Matched','Needs a look','Conflict','Other company','In no register','Net before tax'];
  const tbl=(first,list)=>'<div class="tablewrap" style="max-height:none"><table><thead><tr><th>'+first+'</th>'+th.map(h=>'<th class="num">'+h+'</th>').join('')+'</tr></thead><tbody>'+list.map(g=>'<tr><td>'+esc(g.key)+'</td><td class="num">'+g.lines+'</td><td class="num">'+(g.ok||'')+'</td><td class="num">'+(g.review||'')+'</td><td class="num">'+(g.exception||'')+'</td><td class="num">'+(g.othco||'')+'</td><td class="num">'+(g.missing||'')+'</td><td class="num">'+fmt(g.net)+'</td></tr>').join('')+'</tbody></table></div>';
  const quoted=rows.filter(x=>x.quote).length, elig=rows.filter(x=>x.reg.length&&!x.cass.adj&&x.rates).length, actFound=rows.filter(x=>x.actual&&x.actual.found).length;
  sec.innerHTML='<div class="kpis">'+kp(S.lines,'invoice lines checked')+kp(S.ok,'matched','c')+kp(S.review,'need a look','w')+kp(S.exception,'in conflict','e')+kp(S.othco,'other company')+kp(S.missing,'in no register','e')+'</div>'+
   '<p class="notice">Main company: <b>'+esc(shortCo(S.primary))+'</b>. Registers: '+esc(App.regs.map(r=>r.source).join(', '))+'. '+(App.quotes?'Pricing sheet: '+quoted+' of '+elig+' AWBs have a quote. ':'')+(App.actual?'Job profit report: '+actFound+' of '+rows.filter(x=>!x.cass.adj).length+' AWBs have a job. ':'')+'</p>'+
   (App.res.scopeMsgs&&App.res.scopeMsgs.length?'<div class="msg show err" style="display:block">'+App.res.scopeMsgs.map(m=>esc(m.text)).join('<br>')+'</div>':'')+
   '<h3>By reason</h3><div class="tablewrap" style="max-height:none"><table><thead><tr><th>Code</th><th>Reason</th><th>Severity</th><th class="num">Lines</th></tr></thead><tbody>'+G.CODES.filter(c=>sm.codes[c.code]&&sm.codes[c.code].lines).map(c=>'<tr><td><span class="id '+SEVCLS[c.sev]+'">'+c.code+'</span></td><td>'+esc(c.label)+'</td><td>'+({err:'Conflict',warn:'Needs a look',info:'Information'})[c.sev]+'</td><td class="num">'+sm.codes[c.code].lines+'</td></tr>').join('')+'</tbody></table></div>'+
   '<h3>By GSA</h3>'+tbl('GSA',sm.byGsa)+'<h3>By status</h3>'+tbl('Status',sm.byStatus);
}
function renderUnbilled(){
  const sec=$('v-unbilled');if(!App.unb){sec.innerHTML='';return;}
  sec.innerHTML='<p class="notice">Register AWBs with an airline prefix that appears on the loaded GSA invoices, with a '+(App.d1.basis==='etd'?'ETD':'shipment date')+' from '+esc(App.d1.from)+' to '+esc(App.d1.to)+', and on no invoice line.</p><div class="tablewrap"><table><thead><tr><th>AWB</th><th>Company</th><th>Airline</th><th>First date</th><th class="num">Register wt</th><th>Buy rate</th><th>Jobs</th></tr></thead><tbody>'+
   (App.unb.map(u=>'<tr><td class="awb">'+esc(u.awb)+'</td><td>'+esc(shortCo(u.company))+'</td><td>'+esc(u.airline)+'</td><td>'+esc(u.date)+'</td><td class="num">'+fmt(u.weight)+'</td><td>'+esc(u.buy)+'</td><td>'+esc(u.jobs.join(' | '))+'</td></tr>').join('')||'<tr><td colspan="7" class="empty">Every register AWB for those airlines in this period is on an invoice.</td></tr>')+'</tbody></table></div>';
}

/* ================= Excel export (formulas) ================= */
App.exportXlsx=async function(){
  if(!App.res||!needXl())return;
  say('Building the workbook…','ok');
  try{
    const wb=window.GSAXlsx.build(window.ExcelJS,{res:App.res,regs:App.regs,opts:App.res.opts,primary:App.res.primary,quotes:App.quotes,pLump:App.pLump,actual:App.actual,heads:[...App.heads],actFiles:App.actFiles,pricingFiles:App.pricingFiles,fullPricing:App.fullPricing,runInfo:App.runInfo,pdfInvoices:App.pdf.result.invoices,skipped:App.pdf.skipped,tds:App.pdf.opt,d1:App.d1,extra:[...App.view.extra],version:G.VERSION,codes:G.CODES,extractRules:X.EXTRACT_RULES});
    dl(await wb.xlsx.writeBuffer(),'GSA_reconciliation_'+stamp()+'.xlsx');
    say('Workbook downloaded. Every computed column is a live formula: change a parameter and it recalculates.','ok');
  }catch(e){console.error(e);say('Export failed: '+e.message,'err');}
};

/* ================= tabs ================= */
const TABS=[['files','Files'],['rules','Rules'],['results','Results'],['invoices','Invoices'],['summary','Summary'],['unbilled','Unbilled']];
function drawTabs(){
  $('tabs').innerHTML=TABS.filter(t=>t[0]!=='unbilled'||App.unb).map(t=>{const dis=['results','invoices','summary','unbilled'].includes(t[0])&&!App.res;let n='';if(App.res){if(t[0]==='results')n='<span class="n">'+App.res.rows.length.toLocaleString('en-IN')+'</span>';if(t[0]==='unbilled')n='<span class="n">'+App.unb.length+'</span>';}
    return '<button role="tab" aria-selected="'+(App.tab===t[0])+'" '+(dis?'disabled':'')+' onclick="App.go(\''+t[0]+'\')">'+t[1]+n+'</button>';}).join('');
}
App.go=function(tab){App.tab=tab;TABS.forEach(t=>{const s=$('v-'+t[0]);if(s)s.hidden=t[0]!==tab;});if(tab==='rules')renderRules();drawTabs();window.scrollTo({top:0});};
$('ver').textContent=G.VERSION; drawTabs(); renderFiles(); renderRules();
['results','invoices','summary','unbilled'].forEach(k=>{$('v-'+k).innerHTML=k==='results'?'<div class="empty">Run the reconciliation to see results.</div>':'';});
App.go('files');
})();

</script>
